<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
 <!-- Rendering ähnlich ClearType unter Windows: Subpixel, LCD-Filter, leichtes Hinting -->
 <match target="font">
   <edit name="antialias" mode="assign"><bool>true</bool></edit>
   <edit name="hinting" mode="assign"><bool>true</bool></edit>
   <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
   <edit name="rgba" mode="assign"><const>rgb</const></edit>
   <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
 </match>

 <!-- Webseiten, die Segoe UI anfordern, bekommen den freien Nachbau Selawik -->
 <alias binding="same">
   <family>Segoe UI</family>
   <accept>
     <family>Selawik</family>
   </accept>
 </alias>

 <alias>
   <family>sans-serif</family>
   <prefer>
     <family>Selawik</family>
     <family>Liberation Sans</family>
     <family>Noto Sans</family>
     <family>Noto Color Emoji</family>
     <family>Noto Emoji</family>
     <family>DejaVu Sans</family>
   </prefer>
 </alias>

 <alias>
   <family>serif</family>
   <prefer>
     <family>Liberation Serif</family>
     <family>Noto Serif</family>
     <family>Noto Color Emoji</family>
     <family>Noto Emoji</family>
     <family>DejaVu Serif</family>
   </prefer>
 </alias>

 <alias>
  <family>monospace</family>
  <prefer>
    <family>MonaspiceRn Nerd Font Mono</family>
    <family>Noto Mono</family>
    <family>Noto Color Emoji</family>
    <family>Noto Emoji</family>
   </prefer>
 </alias>
</fontconfig>
